name: CI

on:
  push:
    branches:
      - main
      - skiplist
  pull_request:
      branches:
        - main
        - skiplist
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ cmake libgtest-dev
      
    - name: Build project
      run: make

    - name: Run executable
      run: ./build/main 

    - name: Build and Test
      run: |
        make test