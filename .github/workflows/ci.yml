name: CI

on:
  push:
    branches:
      - skiplist
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ cmake libgtest-dev
    - name: Build project
      run: make
    - name: Run executable
      run: ./main   
    - name: Build and Test
      run: |
        make test